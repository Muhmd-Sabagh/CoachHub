name: Release readiness

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Ephemeral SQL Server for integration tests that must run on the real provider
    # (query filters, constraints, migrations). The SA password is CI-only and the
    # container is reachable only from this job.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CoachHub_CI_only_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CoachHub_CI_only_2026!' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      COACHHUB_TEST_SQL: Server=localhost,1433;User ID=sa;Password=CoachHub_CI_only_2026!;Encrypt=True;TrustServerCertificate=True

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/coachhub-web/package-lock.json

      - name: Run release gate
        shell: pwsh
        run: ./scripts/Verify-Release.ps1

      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14
