<div class="pagination" [attr.aria-label]="'Pagination, ' + totalCount + ' records'">
  <span>{{ totalCount }} records</span>
  <div>
    <button
      class="button button-secondary"
      type="button"
      (click)="previous()"
      [disabled]="page <= 1"
    >
      Previous</button
    ><span>Page {{ page }} of {{ totalPages || 1 }}</span
    ><button
      class="button button-secondary"
      type="button"
      (click)="next()"
      [disabled]="page >= totalPages"
    >
      Next
    </button>
  </div>
</div>
