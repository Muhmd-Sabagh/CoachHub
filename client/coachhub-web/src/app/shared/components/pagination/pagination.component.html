<nav class="pagination" [attr.aria-label]="'common.pagination' | translate">
  <span>{{ 'common.records' | translate: { count: totalCount } }}</span>
  <div>
    <button class="button button-secondary" type="button" (click)="previous()" [disabled]="page <= 1">
      {{ 'common.previous' | translate }}</button
    ><span>{{ 'common.pageOf' | translate: { page: page, pages: totalPages || 1 } }}</span
    ><button class="button button-secondary" type="button" (click)="next()" [disabled]="page >= totalPages">
      {{ 'common.next' | translate }}
    </button>
  </div>
</nav>
